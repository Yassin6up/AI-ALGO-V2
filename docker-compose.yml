version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: neoalgo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: neoalgo_ai
    ports:
      - '3306:3306'
    volumes:
      - neoalgo_mysql:/var/lib/mysql
volumes:
  neoalgo_mysql:
